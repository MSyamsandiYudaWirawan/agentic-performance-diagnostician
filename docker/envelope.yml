# Per-run measurement envelope — the half the agent can NEVER touch
# (scope §10.7 packaging split, build step 3).
#
# Merged at run time with the target clone's agent-editable half:
#   docker compose -f docker/envelope.yml \
#                  -f targets/spring-petclinic/compose-service.yml \
#                  -p <run-id> build service \
#     then: up -d --wait service ; run --rm k6 ; stop (grace) ; down -v
#
# Lives at docker/envelope.yml, NOT docker/target/ — the bare `target/`
# gitignore rule (Maven output, matches at any depth) hides that path
# from git entirely. Paid for once (2026-09-16); don't rename it back.
#
# The two files are disjoint by design:
#   envelope (this file)  — limits, healthcheck, JFR volume, stop grace, k6
#   compose-service.yml   — build stanza + JAVA_OPTS (incl. always-on JFR via
#                           ${JFR_SUBDIR}); the agent's legitimate edit surface
#
# All ${VARS} are interpolated by TargetStack from the Java ProcessBuilder
# environment — host paths in Docker-Desktop form (C:/..., forward slashes,
# scope §10.10 DockerPaths.toMount; never Git Bash, never MSYS_NO_PATHCONV).
#
#   EVIDENCE_DIR     host run dir (evidence/artifacts/<run-id>) — JFR + k6
#                    summary land here. Mounted TWICE: /jfr-repo (target,
#                    JFR writes) and /evidence (k6, summary writes).
#   JFR_SUBDIR       label subdir under EVIDENCE_DIR (baseline-1..3, iter-<n>,
#                    smoke-<n>) — consumed by compose-service.yml's JAVA_OPTS.
#                    TargetStack creates it on the host BEFORE `up`: a missing
#                    dir means JFR silently doesn't start (scope §10.15).
#   BENCHMARKS_DIR   host benchmarks/ dir — the k6 script artifact, read-only
#                    (the agent cannot edit its own ruler, scope §10.7).
#   K6_SCRIPT        container path of the script (default: petclinic)
#   K6_SUMMARY_OUT   container path under /evidence — lands on host (§10.16)
#   K6_VUS / K6_DURATION / K6_RAMP / K6_ENTITY_COUNT / K6_WRITE_RATIO
#                    smoke-gate overrides; empty -> the committed script's
#                    fixed 200 VU / 60s profile (see benchmarks/petclinic/
#                    load-test.js header). Full runs pass NOTHING here.

services:
  service:
    # NOTE: no container_name — the -p <run-id> project isolates runs, and a
    # fixed name would collide across projects (REF's fixed name was
    # single-run only; we also run smoke + janitor sweeps).
    volumes:
      - ${EVIDENCE_DIR}:/jfr-repo
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G
        reservations:
          cpus: '2.00'
          memory: 2G
    healthcheck:
      # Actuator is not guaranteed on arbitrary targets; a listening port is
      # the only universal readiness signal (REF envelope, carried).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    # 15s grace so JFR dumponexit flushes on `compose stop` (scope §5)
    # Dockerfile.target's `exec java` makes the JVM PID 1 so the signal lands.
    stop_grace_period: 15s

  # k6 is NEVER started by `up` — TargetStack drives it via `compose run`
  # (smoke gate first, then the full run), REF run-experiment.sh pattern.
  k6:
    image: grafana/k6:0.57.0
    volumes:
      - ${BENCHMARKS_DIR}:/benchmarks:ro
      - ${EVIDENCE_DIR}:/evidence
    working_dir: /benchmarks
    environment:
      TARGET_URL: http://service:8080
      K6_SUMMARY_OUT: ${K6_SUMMARY_OUT:-/evidence/k6-summary.json}
      # Smoke-gate overrides; empty strings fall through to the committed
      # script's fixed profile constants.
      K6_VUS: ${K6_VUS:-}
      K6_DURATION: ${K6_DURATION:-}
      K6_RAMP: ${K6_RAMP:-}
      K6_ENTITY_COUNT: ${K6_ENTITY_COUNT:-}
      K6_WRITE_RATIO: ${K6_WRITE_RATIO:-}
    command: run ${K6_SCRIPT:-/benchmarks/petclinic/load-test.js}
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    depends_on:
      service:
        condition: service_healthy
