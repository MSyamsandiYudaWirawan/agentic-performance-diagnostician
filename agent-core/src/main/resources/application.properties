# Provider: Z.AI (GLM) via its Anthropic-protocol endpoint. The monthly/coding
# plan funds /api/anthropic ONLY — the OpenAI-protocol endpoint (paas/v4) has a
# separate pay-as-you-go wallet and returns 429 "no resource package" for plan
# users (measured 2026-09-22). Key via env, never committed; empty default so
# keyless contexts boot — the step-8 gate refuses the chat turn without a real
# key (§10.8).
spring.ai.anthropic.api-key=${ZAI_API_KEY:}
spring.ai.anthropic.base-url=https://api.z.ai/api/anthropic

spring.ai.anthropic.chat.options.model=${diag.agent.model:glm-4.6}
spring.ai.anthropic.chat.options.temperature=${diag.agent.temperature:0.2}
spring.ai.anthropic.chat.options.max-tokens=${diag.agent.max-tokens:4096}

# Generation params — recorded verbatim as run.gen_params (§10.20/§10.34).
# Keep truthful: provider must match whatever base-url actually serves.
# NB: model ids are the bare API codes (glm-5.3, glm-4.6) — the "[1m]" suffix
# is a UI context-length tag and 400s as "Unknown Model".
diag.agent.provider=zai
diag.agent.model=glm-5.3
