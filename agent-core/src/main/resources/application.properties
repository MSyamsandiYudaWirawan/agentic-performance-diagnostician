# Provider: Z.AI (GLM) via its Anthropic-protocol endpoint. The monthly/coding
# plan funds /api/anthropic ONLY — the OpenAI-protocol endpoint (paas/v4) has a
# separate pay-as-you-go wallet and returns 429 "no resource package" for plan
# users (measured 2026-09-22). Key via env, never committed; empty default so
# keyless contexts boot — the step-8 gate refuses the chat turn without a real
# key (§10.8).
spring.ai.anthropic.api-key=${ZAI_API_KEY:}
spring.ai.anthropic.base-url=https://api.z.ai/api/anthropic

spring.ai.anthropic.chat.model=${diag.agent.model:glm-4.6}
spring.ai.anthropic.chat.temperature=${diag.agent.temperature:0.2}
spring.ai.anthropic.chat.max-tokens=${diag.agent.max-tokens:4096}

# Generation params — recorded verbatim as run.gen_params (§10.20/§10.34).
# Keep truthful: provider must match whatever base-url actually serves.
# NB: model ids are the bare API codes (glm-5.3, glm-4.6) — the "[1m]" suffix
# is a UI context-length tag and 400s as "Unknown Model".
diag.agent.provider=zai
diag.agent.model=glm-5.3

# Watch item M4: disable multiplying client retries so loop-level backoff (D3) owns retries
spring.ai.retry.max-attempts=1

# Decouple Chat (Anthropic) from Embedding (OpenAI-compatible /v1/embeddings)
spring.ai.model.chat=anthropic
spring.ai.model.embedding=openai

# Dynamic Embedding Endpoint  point to OpenAI, local Ollama (http://localhost:11434), Z.AI, etc.
spring.ai.openai.embedding.base-url=${EMBEDDING_BASE_URL:https://api.openai.com}
spring.ai.openai.embedding.api-key=${EMBEDDING_API_KEY:dummy-key-for-offline}
spring.ai.openai.embedding.options.model=${diag.memory.embedding-model}

# Episodic Memory Config
diag.memory.enabled=${DIAG_MEMORY_ENABLED:true}
diag.memory.evaluation-mode=${DIAG_MEMORY_EVAL_MODE:false}
diag.memory.embedding-model=${EMBEDDING_MODEL:text-embedding-3-small}
diag.memory.similarity-threshold=${DIAG_MEMORY_THRESHOLD:0.70}
diag.memory.top-k=${DIAG_MEMORY_TOP_K:3}
diag.memory.schema-version=1

# PgVectorStore + Flyway dimension
spring.flyway.placeholders.vector.dimension=${EMBEDDING_DIMENSION:1536}
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSION:1536}